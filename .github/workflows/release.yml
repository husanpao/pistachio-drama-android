name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: meta
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' android/app/build.gradle.kts | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\)/\1/p' android/app/build.gradle.kts | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::versionName not found"
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            NEEDED=false
          else
            NEEDED=true
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "needed=$NEEDED" >> "$GITHUB_OUTPUT"
          echo "release v$VERSION needed=$NEEDED"

      - name: Warn when signing is not configured
        if: steps.meta.outputs.needed == 'true' && env.KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::No release created: configure Android signing secrets first."

      - uses: actions/setup-java@v4
        if: steps.meta.outputs.needed == 'true' && env.KEYSTORE_BASE64 != ''
        with:
          distribution: temurin
          java-version: "17"

      - name: Build release
        if: steps.meta.outputs.needed == 'true' && env.KEYSTORE_BASE64 != ''
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android assembleRelease --no-daemon --refresh-dependencies --stacktrace

      - name: Sign release
        if: steps.meta.outputs.needed == 'true' && env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/zipalign" -f -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/app-release-aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "artifacts/pistachio-drama-android-v${{ steps.meta.outputs.version }}.apk" \
            "$RUNNER_TEMP/app-release-aligned.apk"
          cp "artifacts/pistachio-drama-android-v${{ steps.meta.outputs.version }}.apk" \
            artifacts/app-release.apk

      - name: Publish GitHub Release
        if: steps.meta.outputs.needed == 'true' && env.KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.meta.outputs.version }}
          files: artifacts/pistachio-drama-android-v${{ steps.meta.outputs.version }}.apk
          generate_release_notes: true

      - name: Update update.json
        if: steps.meta.outputs.needed == 'true' && env.KEYSTORE_BASE64 != ''
        run: |
          SHA256=$(sha256sum artifacts/app-release.apk | awk '{print $1}')
          SIZE=$(stat -c%s artifacts/app-release.apk)
          cat > update.json <<EOF
          {
            "version": "${{ steps.meta.outputs.version }}",
            "tag": "",
            "apk_path": "artifacts/app-release.apk",
            "apk_name": "pistachio-drama-android-v${{ steps.meta.outputs.version }}.apk",
            "sha256": "$SHA256",
            "size": $SIZE,
            "release_url": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${{ steps.meta.outputs.version }}",
            "notes": "Release v${{ steps.meta.outputs.version }}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json artifacts/app-release.apk
          git commit -m "chore: release v${{ steps.meta.outputs.version }} [skip ci]"
          git push origin HEAD:main
