name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build release
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android assembleRelease --no-daemon --refresh-dependencies --stacktrace

      - name: Sign release
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/zipalign" -f -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/app-release-aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "artifacts/pistachio-drama-android-${GITHUB_REF_NAME}.apk" \
            "$RUNNER_TEMP/app-release-aligned.apk"

      - name: Publish GitHub Release
        if: env.KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/pistachio-drama-android-${{ github.ref_name }}.apk
          generate_release_notes: true

      - name: Signing secrets missing
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::Release was not published because Android signing secrets are not configured."
